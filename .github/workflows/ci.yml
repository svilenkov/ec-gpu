name: CI

on: [pull_request, push]

# Cancel a job if there's a new one on the same branch started.
# Based on https://stackoverflow.com/questions/58895283/stop-already-running-workflow-job-in-github-actions/67223051#67223051
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Faster crates.io index checkout.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  cuda_tests:
    # GitHub's hosted runner has no NVIDIA GPU. PantheonSim simulates an NVIDIA T4 on the CPU,
    # so the tests with the `cuda` feature run here.
    runs-on: ubuntu-24.04
    name: CUDA tests on a simulated T4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: nvidia/t4
      - name: Show the simulated GPU
        run: nvidia-smi
      - name: Run tests with the cuda feature
        run: cargo +stable test --package gpu-tests --release --no-default-features --features cuda -- --nocapture
